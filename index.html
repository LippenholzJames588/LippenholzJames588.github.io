<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"cheesy-beef-and-macaroni-casserole":"https://chefalchemy.com/cheesy-beef-and-macaroni-casserole/","cheesy-bowtie-pasta-with-savory-cajun-ground-beef-in-garlic-cream":"https://chefalchemy.com/cheesy-bowtie-pasta-with-savory-cajun-ground-beef-in-garlic-cream/","cheesy-garlic-twisted-pasta-with-cajun-ground-beef-and-alfredo-velveeta":"https://chefalchemy.com/cheesy-garlic-twisted-pasta-with-cajun-ground-beef-and-alfredo-velveeta/","cheesy-ground-beef-tater-tot-casserole":"https://chefalchemy.com/cheesy-ground-beef-tater-tot-casserole/","cheesy-ground-beef-and-potato-casserole":"https://chefalchemy.com/cheesy-ground-beef-and-potato-casserole/","cheesy-ground-beef-and-rice-casserole":"https://chefalchemy.com/cheesy-ground-beef-and-rice-casserole/","cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef":"https://chefalchemy.com/cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef/","cheesy-taco-rice-skillet":"https://chefalchemy.com/cheesy-taco-rice-skillet/","cheesy-tater-tot-casserole":"https://chefalchemy.com/cheesy-tater-tot-casserole/","classic-one-pot-taco-pasta":"https://chefalchemy.com/classic-one-pot-taco-pasta/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
